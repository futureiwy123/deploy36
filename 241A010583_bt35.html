<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài tập 35 - Danh sách sản phẩm</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background-color: #f4f6f9; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        .back-link { display: inline-block; margin-bottom: 10px; text-decoration: none; color: #0056b3; font-weight: bold; }
        h2 { text-align: center; color: #333; }
        .search-box { display: flex; justify-content: center; margin-bottom: 25px; }
        #search-input {
            width: 100%; max-width: 450px; padding: 12px 16px;
            font-size: 16px; border: 2px solid #ccc; border-radius: 8px; outline: none;
        }
        #search-input:focus { border-color: #0056b3; }
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }
        .product-card {
            background: white; border-radius: 8px; padding: 16px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            display: flex; flex-direction: column; justify-content: space-between;
            transition: transform 0.2s;
        }
        .product-card:hover { transform: translateY(-4px); }
        .product-card h3 { margin: 0 0 10px 0; font-size: 18px; color: #222; }
        .product-category { font-size: 13px; color: #666; margin-bottom: 8px; }
        .product-price { font-size: 16px; font-weight: bold; color: #d32f2f; }
        #error-message {
            display: none; text-align: center; color: #d32f2f;
            background-color: #fdecea; border: 1px solid #f5c6cb;
            padding: 15px; border-radius: 8px; font-weight: bold; margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link">← Quay lại Trang chủ</a>
        <h2>DANH SÁCH SẢN PHẨM CÔNG NGHỆ</h2>
        <div class="search-box">
            <input type="text" id="search-input" placeholder="Nhập tên sản phẩm cần tìm...">
        </div>
        <div id="product-list" class="product-grid"></div>
        <div id="error-message">Không tìm thấy sản phẩm nào phù hợp với từ khóa của bạn!</div>
    </div>

    <script>
        const products = [
            { id: 1, name: "Laptop Dell XPS 13", category: "Laptop", price: "28.500.000 đ" },
            { id: 2, name: "iPhone 15 Pro Max", category: "Điện thoại", price: "31.990.000 đ" },
            { id: 3, name: "Bàn phím cơ Keychron K2", category: "Phụ kiện", price: "1.850.000 đ" },
            { id: 4, name: "Chuột không dây Logitech MX Master 3S", category: "Phụ kiện", price: "2.490.000 đ" },
            { id: 5, name: "Màn hình LG UltraGear 27 inch", category: "Màn hình", price: "6.790.000 đ" },
            { id: 6, name: "Tai nghe Sony WH-1000XM5", category: "Âm thanh", price: "7.490.000 đ" }
        ];

        const productListEl = document.getElementById("product-list");
        const searchInputEl = document.getElementById("search-input");
        const errorMsgEl = document.getElementById("error-message");

        function renderProducts(list) {
            productListEl.innerHTML = "";
            if (list.length === 0) {
                errorMsgEl.style.display = "block";
                return;
            }
            errorMsgEl.style.display = "none";

            list.forEach(product => {
                const card = document.createElement("div");
                card.className = "product-card";

                const title = document.createElement("h3");
                title.textContent = product.name;

                const category = document.createElement("div");
                category.className = "product-category";
                category.textContent = "Danh mục: " + product.category;

                const price = document.createElement("div");
                price.className = "product-price";
                price.textContent = product.price;

                card.appendChild(title);
                card.appendChild(category);
                card.appendChild(price);
                productListEl.appendChild(card);
            });
        }

        let debounceTimer;
        searchInputEl.addEventListener("input", function(event) {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
                const keyword = event.target.value.trim().toLowerCase();
                const filteredProducts = products.filter(item =>
                    item.name.toLowerCase().includes(keyword)
                );
                renderProducts(filteredProducts);
            }, 200);
        });

        renderProducts(products);
    </script>
</body>
</html>
