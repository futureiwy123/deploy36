<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài tập 35b - Đồng Hồ Đếm Ngược</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background-color: #f0f2f5; margin: 0;
            display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh;
        }
        .back-link { margin-bottom: 15px; text-decoration: none; color: #0056b3; font-weight: bold; }
        .timer-card {
            background: white; padding: 35px 40px; border-radius: 14px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.1); text-align: center; width: 90%; max-width: 400px;
        }
        h2 { margin-top: 0; color: #333; font-size: 22px; }
        #timer-display { font-size: 64px; font-weight: bold; color: #0056b3; margin: 20px 0; letter-spacing: 3px; }
        .warning-pulse { color: #d32f2f !important; animation: pulseAnim 1s infinite ease-in-out; }
        @keyframes pulseAnim {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.08); opacity: 0.65; }
            100% { transform: scale(1); opacity: 1; }
        }
        .btn-group { display: flex; gap: 10px; justify-content: center; }
        button {
            padding: 10px 18px; font-size: 15px; font-weight: bold;
            border: none; border-radius: 6px; cursor: pointer; color: white;
        }
        #start-btn { background-color: #28a745; }
        #pause-btn { background-color: #ffc107; color: #222; }
        #reset-btn { background-color: #6c757d; }
        .modal-overlay {
            display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.55);
            justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-box {
            background: white; padding: 25px 30px; border-radius: 10px;
            text-align: center; max-width: 320px; width: 85%;
        }
        .modal-box h3 { margin-top: 0; color: #d32f2f; font-size: 22px; }
        .modal-box button { background-color: #0056b3; margin-top: 10px; width: 100%; }
    </style>
</head>
<body>
    <a href="index.html" class="back-link">← Quay lại Trang chủ</a>
    <div class="timer-card">
        <h2>ĐỒNG HỒ ĐẾM NGƯỢC</h2>
        <div id="timer-display">10:00</div>
        <div class="btn-group">
            <button id="start-btn">Bắt đầu</button>
            <button id="pause-btn">Tạm dừng</button>
            <button id="reset-btn">Đặt lại</button>
        </div>
    </div>

    <div id="alert-modal" class="modal-overlay">
        <div class="modal-box">
            <h3>HẾT THỜI GIAN!</h3>
            <p>Thời gian đếm ngược 10 phút đã kết thúc.</p>
            <button id="close-modal-btn">Đóng</button>
        </div>
    </div>

    <script>
        const INITIAL_SECONDS = 10 * 60;
        let remainingSeconds = INITIAL_SECONDS;
        let timerInterval = null;

        const displayEl = document.getElementById("timer-display");
        const startBtn = document.getElementById("start-btn");
        const pauseBtn = document.getElementById("pause-btn");
        const resetBtn = document.getElementById("reset-btn");
        const alertModal = document.getElementById("alert-modal");
        const closeModalBtn = document.getElementById("close-modal-btn");

        function formatTime(totalSeconds) {
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            return String(minutes).padStart(2, "0") + ":" + String(seconds).padStart(2, "0");
        }

        function updateUI() {
            displayEl.textContent = formatTime(remainingSeconds);
            if (remainingSeconds > 0 && remainingSeconds < 60) {
                displayEl.classList.add("warning-pulse");
            } else {
                displayEl.classList.remove("warning-pulse");
            }
        }

        function stopTimer() {
            if (timerInterval !== null) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        function startTimer() {
            if (timerInterval !== null || remainingSeconds <= 0) return;
            const targetTime = Date.now() + remainingSeconds * 1000;
            timerInterval = setInterval(() => {
                const diff = Math.round((targetTime - Date.now()) / 1000);
                remainingSeconds = diff > 0 ? diff : 0;
                updateUI();
                if (remainingSeconds <= 0) {
                    stopTimer();
                    alertModal.style.display = "flex";
                }
            }, 1000);
        }

        function resetTimer() {
            stopTimer();
            remainingSeconds = INITIAL_SECONDS;
            updateUI();
        }

        startBtn.addEventListener("click", startTimer);
        pauseBtn.addEventListener("click", stopTimer);
        resetBtn.addEventListener("click", resetTimer);
        closeModalBtn.addEventListener("click", () => { alertModal.style.display = "none"; });
        window.addEventListener("beforeunload", stopTimer);
        updateUI();
    </script>
</body>
</html>
